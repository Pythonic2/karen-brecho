{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Telles' Thrift Shop{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/shop.css' %}">
  <link rel="stylesheet" href="{% static 'css/suppliers.css' %}">
  <link rel="stylesheet" href="{% static 'css/images.css' %}">
  <link rel="stylesheet" href="{% static 'css/green-theme.css' %}">
  <link rel="stylesheet" href="{% static 'css/statements.css' %}">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <header class="site-header">
    <a class="brand" href="{% url 'catalog:home' %}">
      <img src="{% static 'img/telles-logo-transparent.png' %}" alt="Telles' Thrift Shop logo">
      <span>Telles' Thrift Shop</span>
    </a>
    <nav><a href="{% url 'catalog:shop' %}">Shop</a><a href="{% url 'suppliers:register' %}">Become a supplier</a><a href="{% url 'transactions:checkout' %}">Cart</a></nav>
  </header>
  {% if messages %}<div class="messages">{% for message in messages %}<p class="message {{ message.tags }}">{{ message }}</p>{% endfor %}</div>{% endif %}
  {% block content %}{% endblock %}
</body>
</html>
