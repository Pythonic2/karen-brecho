services:
  telles-thrift-shop:
    build: .
    restart: unless-stopped
    pull_policy: build
    environment:
      - DJANGO_SECRET_KEY
      - DJANGO_DEBUG
      - DJANGO_ALLOWED_HOSTS
      - DJANGO_CSRF_TRUSTED_ORIGINS
      - SITE_BASE_URL
      - SQLITE_PATH
      - MEDIA_ROOT
      - SESSION_COOKIE_SECURE
      - CSRF_COOKIE_SECURE
      - SECURE_SSL_REDIRECT
      - SECURE_HSTS_SECONDS
      - EMAIL_BACKEND
      - EMAIL_HOST
      - EMAIL_PORT
      - EMAIL_HOST_USER
      - EMAIL_HOST_PASSWORD
      - EMAIL_USE_TLS
      - DEFAULT_FROM_EMAIL
    command: ["gunicorn", "telles_shop.wsgi:application", "--bind", "0.0.0.0:8002", "--workers", "3", "--timeout", "60", "--access-logfile", "-", "--error-logfile", "-"]
    volumes:
      - database_data:/app/data
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8002:8002"
    networks:
      - pi_default
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; r=urllib.request.Request('http://127.0.0.1:8002/health/', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r, timeout=3)\" >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

networks:
  pi_default:
    external: true

volumes:
  database_data:
  media_data:
  static_data:
